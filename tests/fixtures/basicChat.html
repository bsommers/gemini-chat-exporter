<main>
  <infinite-scroller class="chat-history">
    <user-query>
      <div class="query-text" data-query-text="true">
        <p>What is the capital of France?</p>
      </div>
    </user-query>
    <model-response>
      <div class="response-container">
        <div class="markdown response-content">
          <p>The capital of France is <strong>Paris</strong>.</p>
        </div>
      </div>
    </model-response>
    <user-query>
      <div class="query-text" data-query-text="true">
        <p>And its population?</p>
      </div>
    </user-query>
    <model-response>
      <div class="response-container">
        <div class="markdown response-content">
          <p>Paris has roughly 2.1 million residents.</p>
        </div>
      </div>
    </model-response>
  </infinite-scroller>
</main>
