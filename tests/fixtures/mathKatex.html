<user-query>
  <div class="query-text" data-query-text="true">
    <p>What is the mass-energy equivalence formula?</p>
  </div>
</user-query>
<model-response>
  <div class="response-container">
    <div class="markdown response-content">
      <p>The formula is
        <span class="math-inline">
          <span class="katex">
            <span class="katex-mathml">
              <math>
                <semantics>
                  <mrow></mrow>
                  <annotation encoding="application/x-tex">E = mc^2</annotation>
                </semantics>
              </math>
            </span>
          </span>
        </span>
        and in block form:
      </p>
      <div class="math-block">
        <span class="katex">
          <span class="katex-mathml">
            <math>
              <semantics>
                <mrow></mrow>
                <annotation encoding="application/x-tex">E = mc^2</annotation>
              </semantics>
            </math>
          </span>
        </span>
      </div>
    </div>
  </div>
</model-response>
